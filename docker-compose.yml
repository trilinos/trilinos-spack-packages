version: '3.8'

services:
  # Quick smoke tests (default)
  test-quick:
    build:
      context: .
      target: app
      cache_from:
        - trilinos-spack-packages:base
        - trilinos-spack-packages:spack-base
        - trilinos-spack-packages:python-deps
        - trilinos-spack-packages:app
    image: trilinos-spack-packages:latest
    container_name: trilinos-test-quick
    command: pytest test/ -m quick -n auto -v
    volumes:
      - ./test:/opt/trilinos-spack-packages/test:ro
      - test-results:/opt/trilinos-spack-packages/test-results
    environment:
      - PYTEST_ADDOPTS=--junitxml=/opt/trilinos-spack-packages/test-results/junit-quick.xml

  # All tests except slow installs
  test-fast:
    build:
      context: .
      target: app
    image: trilinos-spack-packages:latest
    container_name: trilinos-test-fast
    command: pytest test/ -m "not slow" -n auto -v
    volumes:
      - ./test:/opt/trilinos-spack-packages/test:ro
      - test-results:/opt/trilinos-spack-packages/test-results
    environment:
      - PYTEST_ADDOPTS=--junitxml=/opt/trilinos-spack-packages/test-results/junit-fast.xml

  # Full test suite (including slow installs)
  test-full:
    build:
      context: .
      target: app
    image: trilinos-spack-packages:latest
    container_name: trilinos-test-full
    command: pytest test/ -n auto -v
    volumes:
      - ./test:/opt/trilinos-spack-packages/test:ro
      - test-results:/opt/trilinos-spack-packages/test-results
      - spack-cache:/opt/spack-src/var/spack
    environment:
      - PYTEST_ADDOPTS=--junitxml=/opt/trilinos-spack-packages/test-results/junit-full.xml

  # Interactive shell for debugging
  shell:
    build:
      context: .
      target: app
    image: trilinos-spack-packages:latest
    container_name: trilinos-shell
    command: /bin/bash
    stdin_open: true
    tty: true
    volumes:
      - .:/opt/trilinos-spack-packages
      - spack-cache:/opt/spack-src/var/spack

  # CI/CD stage that validates during build
  test-build:
    build:
      context: .
      target: test
    image: trilinos-spack-packages:test
    container_name: trilinos-test-build

volumes:
  test-results:
    driver: local
  spack-cache:
    driver: local
